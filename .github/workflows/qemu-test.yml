name: qemu-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make nasm binutils qemu-system-x86
      - name: 1/3 Build + layering lint (BUILD=PASS)
        run: |
          make all && make lint-layers && echo "BUILD=PASS"
      - name: 2/3 Boot + self-tests (QEMU=PASS)
        run: |
          bash scripts/ci/run_qemu_test.sh
      - name: 3/3 Boot via multiboot2 ISO (BOOT=PASS)
        run: |
          sudo apt-get install -y --no-install-recommends grub-common xorriso \
            ovmf
          make iso
          timeout 120 qemu-system-x86_64 \
            -bios /usr/share/OVMF/OVMF.fd \
            -cdrom build/images/newos-x86_64.iso \
            -boot d -serial file:build/mb2-boot.log -no-reboot -m 128M \
            -display none
          grep -E "NEWOS .* booted" build/mb2-boot.log \
            && grep -E "[0-9]+ tests, 0 failures" build/mb2-boot.log \
            && echo "BOOT=PASS"
      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-logs
          path: |
            build/mb2-boot.log
          if-no-files-found: ignore